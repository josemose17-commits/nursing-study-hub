<!DOCTYPE html>

<link rel="stylesheet" href="_ds/nocturne-35f0a9b3-313f-4c7b-8efd-c00cd545fa18/styles.css?v=202610021900">
<style>
  :root { --ok: var(--color-accent-2-400); --ok-bg: var(--color-accent-2-900); --ok-bd: var(--color-accent-2-700); --bad: #f39a8a; --bad-bg: rgba(243, 154, 138, .12); --bad-bd: rgba(243, 154, 138, .5); }
  body { padding-bottom: 96px; }
  main { max-width: 860px; margin: 0 auto; padding: clamp(18px, 3.5vw, 40px) 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--color-accent-300); }
  h1 { font-size: clamp(28px, 5.5vw, 44px); margin: 4px 0 6px; }
  .lead { color: var(--color-neutral-300); max-width: 70ch; margin: 0; }
  .glass { border-radius: var(--radius-lg); background: var(--color-surface); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-md); }
  button { font: inherit; color: inherit; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); cursor: pointer; font-size: 14px; color: inherit; text-decoration: none; }
  .pill:hover { border-color: var(--color-accent-700); }
  .pill[aria-pressed="true"], .pill.on { background: var(--color-accent); border-color: var(--color-accent); color: #04160e; font-weight: 600; }
  .pill.gold { border-color: var(--color-accent-700); color: var(--color-accent-200); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* Topics */
  .topics { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); cursor: pointer; text-align: left; font-size: 13.5px; line-height: 1.3; }
  .chip .box { flex: none; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--color-neutral-500); }
  .chip[aria-pressed="true"] { border-color: var(--color-accent-700); background: var(--color-accent-900); }
  .chip[aria-pressed="true"] .box { background: var(--color-accent); border-color: var(--color-accent); }
  .chip small { color: var(--color-neutral-400); }
  select.add { max-width: 100%; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); color: var(--color-text); font: inherit; font-size: 13.5px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Stage */
  .stage { padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 220px; }
  .stage h2 { margin: 0; font-size: clamp(20px, 4.4vw, 26px); }
  .prompt { margin: 0; color: var(--color-neutral-300); font-size: 14.5px; }
  .prog { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--color-neutral-400); }
  .bar { height: 4px; border-radius: 2px; background: var(--color-neutral-800); overflow: hidden; margin-top: -8px; }
  .bar > div { height: 100%; background: var(--color-accent); transition: width .25s; }
  .msg { padding: 10px 14px; border-radius: 10px; font-size: 14.5px; line-height: 1.5; }
  .msg.ok { background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--color-accent-2-200); }
  .msg.bad { background: var(--bad-bg); border: 1px solid var(--bad-bd); color: #fde2dc; }
  .msg .why { display: block; margin-top: 6px; color: var(--color-neutral-200); font-size: 13.5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn-main { padding: 10px 18px; border-radius: 999px; border: 0; background: var(--color-accent); color: #04160e; font-weight: 600; cursor: pointer; }
  .btn-main[disabled] { opacity: .45; cursor: default; }
  .btn-soft { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); cursor: pointer; }
  .empty { color: var(--color-neutral-300); }

  /* Build the chain */
  .slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
  .slots li { counter-increment: s; display: flex; gap: 10px; align-items: stretch; }
  .slots li::before { content: counter(s); flex: none; width: 26px; display: grid; place-items: center; font-size: 13px; color: var(--color-accent-300); }
  .slot { flex: 1; min-height: 42px; padding: 9px 12px; border-radius: 10px; border: 1px dashed var(--color-neutral-700); color: var(--color-neutral-500); font-size: 14.5px; text-align: left; background: transparent; }
  .slot.filled { border-style: solid; border-color: var(--color-accent-700); color: var(--color-text); background: var(--color-accent-900); cursor: pointer; }
  .slot.ok { border: 1px solid var(--ok-bd); background: var(--ok-bg); }
  .slot.bad { border: 1px solid var(--bad-bd); background: var(--bad-bg); }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; }
  .step { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); cursor: pointer; font-size: 14.5px; text-align: left; }
  .step:hover { border-color: var(--color-accent-700); }
  .answer-chain { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 14px; }
  .answer-chain span.a { color: var(--color-neutral-500); }

  /* Fill in the notes */
  .context { font-size: 12.5px; color: var(--color-neutral-400); }
  .context b { color: var(--color-accent-200); font-weight: 500; }
  .bullet { font-size: 17px; line-height: 1.6; padding: 12px 14px; border-radius: 12px; background: var(--color-neutral-900); border: 1px solid var(--color-divider); }
  .bullet b { font-weight: 600; color: var(--color-neutral-100); }
  .blank { display: inline-block; min-width: 5.5em; border-bottom: 2px solid var(--color-accent); color: transparent; }
  .blank.ok { color: var(--ok); border-color: var(--ok); }
  .blank.bad { color: var(--bad); border-color: var(--bad); }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
  .choice { padding: 11px 14px; border-radius: 10px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); cursor: pointer; text-align: left; font-size: 15px; }
  .choice:hover:not([disabled]) { border-color: var(--color-accent-700); }
  .choice.ok { border-color: var(--ok-bd); background: var(--ok-bg); }
  .choice.bad { border-color: var(--bad-bd); background: var(--bad-bg); }
  .choice[disabled] { cursor: default; }
  .typed { display: flex; gap: 8px; flex-wrap: wrap; }
  .typed input { flex: 1 1 200px; min-width: 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); color: var(--color-text); font: inherit; font-size: 15px; }
  .linkish { background: none; border: 0; padding: 0; color: var(--color-accent-300); cursor: pointer; text-decoration: underline; font-size: 13.5px; }

  /* Match it up */
  .mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .mcol { display: flex; flex-direction: column; gap: 8px; }
  .mcol .lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-500); }
  .mi { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--color-divider); background: var(--color-neutral-900); cursor: pointer; text-align: left; font-size: 14px; line-height: 1.35; min-height: 44px; transition: opacity .2s; }
  .mi.sel { border-color: var(--color-accent); background: var(--color-accent-900); }
  .mi.ok { border-color: var(--ok-bd); background: var(--ok-bg); opacity: .55; cursor: default; }
  .mi.bad { border-color: var(--bad-bd); background: var(--bad-bg); }
  .missed { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--color-neutral-200); display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 420px) { .stage { padding: 14px; } .mi { font-size: 13px; padding: 9px 10px; } }
</style>

<script>
// Practice: three hands-on activities built from the topics missed on the last Mastery test.
// Build the chain (Concept Map chains), Fill in the notes (bold words in the short notes), Match it up
// (note headings, drugs, organ → molecule levels, myths, looked-up words). Misses come back until right.
(function () {
  var TOPICS = window.INFO_TOPICS || [], byId = {}; TOPICS.forEach(function (t) { byId[t.id] = t; });
  var NODES = window.CONCEPT_NODES || [], nodeById = {}; NODES.forEach(function (n) { nodeById[n.id] = n; });
  var NS = window.NOTES_SHORT || {};
  var CHS = ['22', '23', '24', '25', '27', '28', '29', '30', '33', '34'];
  var SIZE = { chain: 8, fill: 12, match: 5 };

  // Topic → Concept Map nodes, the same rule as the Map.
  var nodesFor = {};
  Object.keys(window.NODE_TOPICS || {}).forEach(function (nid) {
    window.NODE_TOPICS[nid].forEach(function (r) {
      TOPICS.forEach(function (t) { if (t.ch === r[0] && r[1].test(t.title)) { var a = nodesFor[t.id] || (nodesFor[t.id] = []); if (a.indexOf(nid) < 0) a.push(nid); } });
    });
  });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function title(id) { var t = byId[id]; return !t ? id : t.kind === 'overview' ? t.chTitle + ' — overview' : t.kind === 'adpie' ? t.chTitle + ' — nursing process' : t.title; }
  function short(id) { var t = title(id); return t.length > 46 ? t.slice(0, 44).replace(/\s+\S*$/, '') + '…' : t; }
  function get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function bolds(s) { return (String(s).match(/\*\*([^*]+)\*\*/g) || []).map(function (m) { return m.slice(2, -2).trim(); }); }
  function md(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
  function norm(s) {
    return String(s).toLowerCase().replace(/[₀-₉]/g, function (c) { return String(c.charCodeAt(0) - 8320); })
      .normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');
  }
  function lev(a, b) {
    var m = a.length, n = b.length, d = []; for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 1; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }
  function chunk(list, max) {
    if (list.length < 3) return [];
    var k = Math.ceil(list.length / max), size = Math.ceil(list.length / k), out = [];
    for (var i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
    if (out.length > 1 && out[out.length - 1].length < 3) { var last = out.pop(); out[out.length - 1] = out[out.length - 1].concat(last); }
    return out;
  }
  // One item from each topic in turn, so a round mixes topics.
  function interleave(items) {
    var by = {}, order = [];
    items.forEach(function (it) { if (!by[it.tid]) { by[it.tid] = []; order.push(it.tid); } by[it.tid].push(it); });
    order.forEach(function (t) { by[t] = shuffle(by[t]); });
    var out = [];
    for (var i = 0, more = true; more; i++) { more = false; order.forEach(function (t) { if (by[t][i]) { out.push(by[t][i]); more = true; } }); }
    return out;
  }

  // ---------- Which topics ----------
  var plan = window.E2Weak ? window.E2Weak.plan(function (t) { return !!byId[t]; }) : null;
  var saved = get('e2-practice') || {};
  var reportNo = plan ? plan.R.no : null;
  if (saved.from !== reportNo) saved = { from: reportNo, off: [], added: [] };
  var mode = /^#(chain|fill|match)$/.test(location.hash) ? location.hash.slice(1) : (saved.mode || 'chain');
  var typing = !!saved.typing;
  function save() { saved.mode = mode; saved.typing = typing; put('e2-practice', saved); }
  function chosen() {
    var ids = (plan ? plan.rank : []).filter(function (t) { return saved.off.indexOf(t) < 0; });
    saved.added.forEach(function (t) { if (byId[t] && ids.indexOf(t) < 0) ids.push(t); });
    return ids;
  }

  var topicsEl = document.getElementById('topics'), stage = document.getElementById('stage'), tabs = document.getElementById('tabs');
  function renderTopics() {
    var h = '';
    if (plan && plan.rank.length) {
      var when = new Date(plan.R.at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      h += '<div class="kicker">Topics you missed on Mastery test ' + esc(plan.R.no) + ' · ' + esc(when) + '</div>';
      h += '<div class="row">' + plan.rank.map(function (t) {
        var on = saved.off.indexOf(t) < 0, st = plan.stat[t];
        return '<button class="chip" data-topic="' + esc(t) + '" aria-pressed="' + on + '"><span class="box"></span><span>' + esc(short(t)) + ' <small>· Ch ' + esc(byId[t].ch) + ' · ' + st.miss + ' missed</small></span></button>';
      }).join('') + '</div>';
    } else {
      h += '<div class="kicker">' + (plan ? 'Nothing missed on your last test' : 'No Mastery test yet') + '</div><p class="lead" style="font-size:14.5px">' +
        (plan ? 'Pick a topic below to practice anyway, or take a new test.' : 'Take a Mastery test first — this page then builds practice from the topics you missed. Or pick a topic below to practice now.') + '</p>';
    }
    if (saved.added.length) h += '<div class="row">' + saved.added.filter(function (t) { return byId[t]; }).map(function (t) {
      return '<button class="chip" data-added="' + esc(t) + '" aria-pressed="true" title="Remove"><span class="box"></span><span>' + esc(short(t)) + ' <small>· Ch ' + esc(byId[t].ch) + ' · added ✕</small></span></button>';
    }).join('') + '</div>';
    h += '<div class="row"><select class="add" id="add" aria-label="Add a topic"><option value="">+ Add another topic…</option>' + CHS.map(function (ch) {
      var ts = TOPICS.filter(function (t) { return t.ch === ch && t.kind !== 'adpie'; });
      return '<optgroup label="Ch ' + ch + ' · ' + esc((ts[0] || {}).chTitle || '') + '">' + ts.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(title(t.id)) + '</option>'; }).join('') + '</optgroup>';
    }).join('') + '</select>' + (plan && plan.rank.length ? '<a class="pill on" href="Exam 2 Mastery Loop.dc.html#redo">Redo my misses →</a>' : '') + '</div>';
    topicsEl.innerHTML = h;
  }
  topicsEl.addEventListener('click', function (e) {
    var c = e.target.closest('[data-topic]'), a = e.target.closest('[data-added]');
    if (c) { var t = c.getAttribute('data-topic'), i = saved.off.indexOf(t); if (i < 0) saved.off.push(t); else saved.off.splice(i, 1); }
    else if (a) { saved.added = saved.added.filter(function (x) { return x !== a.getAttribute('data-added'); }); }
    else return;
    save(); renderTopics(); fresh();
  });
  topicsEl.addEventListener('change', function (e) {
    if (e.target.id !== 'add' || !e.target.value) return;
    var t = e.target.value;
    if (plan && plan.rank.indexOf(t) >= 0) saved.off = saved.off.filter(function (x) { return x !== t; });
    else if (saved.added.indexOf(t) < 0) saved.added.push(t);
    save(); renderTopics(); fresh();
  });

  // ---------- Building the items ----------
  function nodesOf(tid) {
    var ids = (nodesFor[tid] || []).slice();
    ((plan && plan.stat[tid]) ? plan.stat[tid].recs : []).forEach(function (r) { (r.nodes || []).forEach(function (n) { if (ids.indexOf(n) < 0) ids.push(n); }); });
    return ids.filter(function (n) { return nodeById[n]; });
  }
  var BUILD = {
    chain: function (tids) {
      var seen = {}, out = [];
      tids.forEach(function (tid) {
        nodesOf(tid).forEach(function (nid) {
          var n = nodeById[nid];
          (n.chains || []).forEach(function (c, ci) {
            var key = 'c|' + nid + '|' + ci;
            if (c.length >= 3 && !seen[key]) { seen[key] = 1; out.push({ key: key, tid: tid, node: n, steps: c, label: n.name + ': ' + c[0] + ' → … → ' + c[c.length - 1] }); }
          });
        });
      });
      return out;
    },
    fill: function (tids) {
      var out = [];
      tids.forEach(function (tid) {
        var blocks = NS[tid] || {}, pool = [];
        Object.keys(blocks).forEach(function (h) { blocks[h].forEach(function (b) { bolds(b).forEach(function (x) { if (pool.indexOf(x) < 0) pool.push(x); }); }); });
        Object.keys(blocks).forEach(function (h, hi) {
          blocks[h].forEach(function (b, bi) {
            var all = bolds(b), terms = all.filter(function (x) { return x.length >= 2 && x.length <= 60 && /[A-Za-z0-9]/.test(x) && all.indexOf(x) === all.lastIndexOf(x); });
            if (!terms.length) return;
            var ans = typing ? terms.slice().sort(function (a, z) { return a.length - z.length; })[0] : terms[Math.floor(Math.random() * terms.length)];
            out.push({ key: 'f|' + tid + '|' + hi + '|' + bi, tid: tid, heading: h, text: b, ans: ans, pool: pool, label: h + ': ' + ans });
          });
        });
      });
      return out;
    },
    match: function (tids) {
      var out = [];
      tids.forEach(function (tid) {
        var t = byId[tid], blocks = NS[tid] || {}, pairs = [];
        Object.keys(blocks).forEach(function (h) {
          var terms = []; blocks[h].forEach(function (b) { bolds(b).forEach(function (x) { if (terms.indexOf(x) < 0) terms.push(x); }); });
          if (terms.length >= 2) pairs.push([terms.slice(0, 3).join(' · '), h]);
        });
        chunk(pairs, 4).forEach(function (p, i) { out.push({ key: 'm|h|' + tid + '|' + i, tid: tid, kind: 'Key points → heading', left: 'Key points', right: 'Heading', pairs: p }); });
        nodesOf(tid).forEach(function (nid) {
          var n = nodeById[nid];
          if ((n.meds || []).length >= 3) chunk(n.meds.map(function (m) { return [m[0], m[1]]; }), 4).forEach(function (p, i) { out.push({ key: 'm|d|' + nid + '|' + i, tid: tid, kind: 'Drug → how it works · ' + n.name, left: 'Drug', right: 'How it works', pairs: p }); });
          if ((n.zoom || []).length >= 3) out.push({ key: 'm|z|' + nid, tid: tid, kind: 'Organ → molecule · ' + n.name, left: 'What happens', right: 'Level', pairs: n.zoom.map(function (z) { return [z[1], z[0]]; }) });
        });
        var R = (window.RECALL_EXTRA || {})[t.ch] || {}, C = ((window.EXPLAIN_CARDS || {})[t.ch] || {}).mc || {};
        var kw = window.E2Focus && window.E2Focus.keywordsFor ? window.E2Focus.keywordsFor(t) : null;
        var myths = (R.mc || []).map(function (x, i) { return [(C[i] && C[i].q) || x[0], x[1]]; }).filter(function (p) { return !kw || kw.test(p[0] + ' ' + p[1]); });
        chunk(myths, 4).forEach(function (p, i) { out.push({ key: 'm|y|' + tid + '|' + i, tid: tid, kind: 'Myth → the truth', left: 'Myth', right: 'The truth', pairs: p }); });
      });
      if (plan && (plan.R.looked || []).length >= 3 && window.E2Say) {
        var w = plan.R.looked.map(function (x) { var m = window.E2Say.meaning(x) || {}; return [m.full || m.def || '', x]; }).filter(function (p) { return p[0]; });
        chunk(w, 5).forEach(function (p, i) { out.push({ key: 'm|w|' + i, tid: '~words', kind: 'Words you looked up', left: 'Meaning', right: 'Word', pairs: p }); });
      }
      // No duplicate texts within a round, or two answers would both be right.
      out = out.filter(function (r) { var a = {}, b = {}; return r.pairs.every(function (p) { var ok = !a[p[0]] && !b[p[1]]; a[p[0]] = b[p[1]] = 1; return ok; }); });
      out.forEach(function (r) { r.label = r.kind + (r.tid !== '~words' ? ' — ' + short(r.tid) : ''); });
      return out;
    }
  };

  // ---------- A round: items in order; a miss comes back three items later (up to three tries) ----------
  var used = { chain: {}, fill: {}, match: {} }, S = null, timer = null;
  function fresh(onlyKeys) {
    var tids = chosen(), all = BUILD[mode](tids), items;
    if (onlyKeys) items = all.filter(function (it) { return onlyKeys.indexOf(it.key) >= 0; });
    else {
      var u = used[mode], unseen = all.filter(function (it) { return !u[it.key]; });
      if (unseen.length < Math.min(SIZE[mode], all.length)) { used[mode] = {}; unseen = all; }
      items = interleave(unseen).slice(0, SIZE[mode]);
    }
    items.forEach(function (it) { used[mode][it.key] = 1; });
    S = { items: items, q: items.slice(), first: {}, tries: {}, done: 0, all: all.length, tids: tids };
    step();
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function progress() {
    var p = document.getElementById('prog'); if (!p || !S) return;
    var right = Object.keys(S.first).filter(function (k) { return S.first[k]; }).length;
    var back = S.q.filter(function (it) { return S.tries[it.key]; }).length;
    p.innerHTML = '<span>' + S.done + ' of ' + S.items.length + ' done</span><span>' + right + ' right first try' + (back ? ' · ' + back + ' coming back' : '') + '</span>';
    document.getElementById('barfill').style.width = Math.round(100 * S.done / Math.max(1, S.items.length)) + '%';
  }
  function step() {
    stop();
    if (!S.items.length) return emptyState();
    if (!S.q.length) return summary();
    var it = S.q.shift();
    stage.innerHTML = '<div class="prog" id="prog"></div><div class="bar"><div id="barfill"></div></div><div id="card" style="display:flex;flex-direction:column;gap:14px"></div>';
    progress();
    RENDER[mode](it, document.getElementById('card'), function (ok) {
      S.tries[it.key] = (S.tries[it.key] || 0) + 1;
      if (S.first[it.key] === undefined) S.first[it.key] = ok;
      if (!ok && S.tries[it.key] < 3) S.q.splice(Math.min(3, S.q.length), 0, it); else S.done++;
      progress();
    });
  }
  // Keep the feedback and the Next button above the bottom tab bar; bring the activity into view on a new item.
  function reveal(el) { var r = el.getBoundingClientRect(), limit = window.innerHeight - 110; if (r.bottom > limit) window.scrollBy({ top: r.bottom - limit, behavior: 'smooth' }); }
  function toStage() { var r = stage.getBoundingClientRect(); if (r.top < 0 || r.top > window.innerHeight * 0.45) window.scrollTo({ top: window.scrollY + r.top - 12, behavior: 'smooth' }); }
  function nextBtn(card, label) {
    var a = document.createElement('div'); a.className = 'actions';
    a.innerHTML = '<button class="btn-main" data-next>' + esc(label || (S.q.length ? 'Next' : 'Finish the round')) + '</button>';
    card.appendChild(a); a.querySelector('[data-next]').focus({ preventScroll: true });
    reveal(a);
  }
  stage.addEventListener('click', function (e) {
    if (e.target.closest('[data-next]')) { step(); toStage(); return; }
    if (e.target.closest('[data-again]')) { fresh(S.items.filter(function (it) { return !S.first[it.key]; }).map(function (it) { return it.key; })); toStage(); return; }
    if (e.target.closest('[data-new]')) { fresh(); toStage(); return; }
    var m = e.target.closest('[data-go]'); if (m) { setMode(m.getAttribute('data-go')); toStage(); return; }
  });
  function summary() {
    var missed = S.items.filter(function (it) { return !S.first[it.key]; }), right = S.items.length - missed.length;
    var h = '<div class="kicker">Round done</div><h2>' + right + ' of ' + S.items.length + ' right the first time</h2>';
    if (missed.length) h += '<p class="prompt">These took more than one try — they’re the ones to go again on:</p><ul class="missed">' + missed.map(function (it) { return '<li>' + esc(it.label) + '</li>'; }).join('') + '</ul>';
    else h += '<p class="prompt">Every one right on the first try.</p>';
    h += '<div class="actions">' + (missed.length ? '<button class="btn-main" data-again>Again with the ' + missed.length + ' I missed</button>' : '') +
      '<button class="' + (missed.length ? 'btn-soft' : 'btn-main') + '" data-new>' + (S.all > S.items.length ? 'Next set' : 'New round') + '</button></div>';
    h += '<div class="row" style="font-size:13.5px;color:var(--color-neutral-400)">Try another: ' + ['chain', 'fill', 'match'].filter(function (m) { return m !== mode; }).map(function (m) { return '<button class="pill" data-go="' + m + '">' + NAME[m] + '</button>'; }).join(' ') + '</div>';
    stage.innerHTML = h;
  }
  function emptyState() {
    var tids = S.tids;
    stage.innerHTML = '<div class="kicker">' + NAME[mode] + '</div><p class="empty">' + (!tids.length ? 'Pick a topic above to start.' :
      mode === 'chain' ? 'These topics have no cause-and-effect chains in the breakdowns yet. Try another activity or add a topic.' : 'Nothing to practice here for these topics yet. Try another activity or add a topic.') + '</p>' +
      (tids.length ? '<div class="row">' + ['chain', 'fill', 'match'].filter(function (m) { return m !== mode; }).map(function (m) { return '<button class="pill" data-go="' + m + '">' + NAME[m] + '</button>'; }).join(' ') + '</div>' : '');
  }

  // ---------- The three activities ----------
  var NAME = { chain: 'Build the chain', fill: 'Fill in the notes', match: 'Match it up' };
  var RENDER = {
    // Tap the steps in order; tap a placed step to take it back.
    chain: function (it, card, done) {
      var steps = it.steps, order = steps.map(function (s, i) { return i; }), pool;
      do { pool = shuffle(order); } while (pool.join() === order.join());
      var placed = [], checked = false;
      function draw() {
        var h = '<div class="kicker">Build the chain · ' + esc(short(it.tid)) + '</div><h2>' + esc(it.node.name) + '</h2>' +
          '<p class="prompt">Tap the steps in order, from the cause to what happens last.' + (checked ? '' : ' Tap a placed step to take it back.') + '</p><ol class="slots">';
        for (var i = 0; i < steps.length; i++) {
          var k = placed[i], cls = k == null ? 'slot' : 'slot filled' + (checked ? (steps[k] === steps[i] ? ' ok' : ' bad') : '');
          h += '<li><button class="' + cls + '" data-slot="' + i + '"' + (k == null || checked ? ' tabindex="-1"' : '') + '>' + (k == null ? '…' : esc(steps[k])) + '</button></li>';
        }
        h += '</ol>';
        if (!checked) h += '<div class="pool">' + pool.filter(function (k) { return placed.indexOf(k) < 0; }).map(function (k) { return '<button class="step" data-step="' + k + '">' + esc(steps[k]) + '</button>'; }).join('') + '</div>' +
          '<div class="actions"><button class="btn-main" data-check' + (placed.length < steps.length ? ' disabled' : '') + '>Check the order</button>' + (placed.length ? '<button class="btn-soft" data-clear>Start over</button>' : '') + '</div>';
        card.innerHTML = h;
        if (checked) {
          var ok = placed.every(function (k, i) { return steps[k] === steps[i]; });
          var m = document.createElement('div'); m.className = 'msg ' + (ok ? 'ok' : 'bad');
          m.innerHTML = (ok ? 'Right — that’s the chain.' : 'Not quite. The order is:') +
            (ok ? '' : '<div class="answer-chain" style="margin-top:6px">' + steps.map(function (s, i) { return (i ? '<span class="a">→</span>' : '') + '<span>' + esc(s) + '</span>'; }).join('') + '</div>') +
            (it.node.core ? '<span class="why">' + esc(it.node.core) + '</span>' : '');
          card.appendChild(m);
          nextBtn(card);
        }
      }
      card.onclick = function (e) {
        if (checked) return;
        var s = e.target.closest('[data-step]'), sl = e.target.closest('[data-slot]');
        if (s) { placed.push(+s.getAttribute('data-step')); draw(); return; }
        if (sl) { var i = +sl.getAttribute('data-slot'); if (placed[i] != null) { placed.splice(i, 1); draw(); } return; }
        if (e.target.closest('[data-clear]')) { placed = []; draw(); return; }
        if (e.target.closest('[data-check]') && placed.length === steps.length) {
          checked = true;
          done(placed.every(function (k, i) { return steps[k] === steps[i]; }));
          draw();
        }
      };
      draw();
    },

    // One bold word blanked; pick it from four, or type it.
    fill: function (it, card, done) {
      var a = norm(it.ans), digit = /\d/.test(it.ans);
      var others = it.pool.filter(function (x) { var n = norm(x); return n && n !== a && it.text.indexOf('**' + x + '**') < 0; });
      if (others.length < 3) TOPICS.filter(function (t) { return t.ch === byId[it.tid].ch && NS[t.id]; }).forEach(function (t) {
        Object.keys(NS[t.id]).forEach(function (h) { NS[t.id][h].forEach(function (b) { bolds(b).forEach(function (x) { if (norm(x) && norm(x) !== a && others.indexOf(x) < 0) others.push(x); }); }); });
      });
      others = others.map(function (x) { return [x, (/\d/.test(x) === digit ? 0 : 3) + Math.abs(x.length - it.ans.length) / 8 + Math.random() * 1.5]; })
        .sort(function (p, q) { return p[1] - q[1]; }).map(function (p) { return p[0]; })
        .filter(function (x, i, arr) { return arr.findIndex(function (y) { return norm(y) === norm(x); }) === i; }).slice(0, 3);
      var choices = shuffle(others.concat([it.ans])), answered = false;
      var re = /\*\*([^*]+)\*\*/g, mm, before = it.text, after = '';
      while ((mm = re.exec(it.text))) { if (mm[1].trim() === it.ans) { before = it.text.slice(0, mm.index); after = it.text.slice(mm.index + mm[0].length); break; } }
      function sentence(cls) { return md(before) + '<span class="blank' + (cls ? ' ' + cls : '') + '">' + (cls ? esc(it.ans) : '&nbsp;') + '</span>' + md(after); }
      function draw() {
        var h = '<div class="kicker">Fill in the notes · ' + esc(short(it.tid)) + '</div><div class="context">From <b>' + esc(it.heading) + '</b></div>' +
          '<div class="bullet" id="sent">' + sentence('') + '</div>';
        if (typing) h += '<form class="typed" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing word"><button class="btn-main">Check</button></form><button class="linkish" data-mode-pick>Show choices instead</button>';
        else h += '<div class="choices">' + choices.map(function (c, i) { return '<button class="choice" data-c="' + i + '">' + esc(c) + '</button>'; }).join('') + '</div><button class="linkish" data-mode-type>Harder: type it instead</button>';
        card.innerHTML = h;
        var f = card.querySelector('#tf');
        if (f) { var inp = card.querySelector('#ti'); inp.focus({ preventScroll: true }); f.onsubmit = function (e) { e.preventDefault(); if (inp.value.trim()) finish(inp.value); }; }
      }
      function finish(given, btn) {
        if (answered) return; answered = true;
        var g = norm(given), ok = g === a || (a.length >= 5 && lev(g, a) <= Math.max(1, Math.floor(a.length / 6))) || norm(String(it.ans).replace(/\s*\(.*?\)\s*/g, ' ')) === g;
        card.querySelector('#sent').innerHTML = sentence(ok ? 'ok' : 'bad');
        card.querySelectorAll('.choice').forEach(function (b) { b.disabled = true; if (norm(b.textContent) === a) b.classList.add('ok'); });
        if (btn && !ok) btn.classList.add('bad');
        var inp = card.querySelector('#ti'); if (inp) inp.disabled = true;
        card.querySelectorAll('.linkish').forEach(function (l) { l.remove(); });
        var m = document.createElement('div'); m.className = 'msg ' + (ok ? 'ok' : 'bad');
        m.innerHTML = ok ? 'Right — <b>' + esc(it.ans) + '</b>.' : 'It’s <b>' + esc(it.ans) + '</b>' + (typing ? ' (you wrote “' + esc(given) + '”)' : '') + '. This one comes back in a few.';
        card.appendChild(m);
        done(ok);
        nextBtn(card);
      }
      card.onclick = function (e) {
        var c = e.target.closest('[data-c]'); if (c) { finish(choices[+c.getAttribute('data-c')], c); return; }
        if (e.target.closest('[data-mode-type]')) { typing = true; save(); draw(); return; }
        if (e.target.closest('[data-mode-pick]')) { typing = false; save(); draw(); return; }
      };
      draw();
    },

    // Tap one on each side. A wrong pair flashes and counts as a miss.
    match: function (it, card, done) {
      var L = shuffle(it.pairs.map(function (p, i) { return i; })), R = shuffle(L), sel = null, got = {}, miss = {}, t0 = Date.now(), over = false;
      function clock() { var s = Math.round((Date.now() - t0) / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
      function stat() { var el = card.querySelector('#mstat'); if (el) el.textContent = clock() + ' · ' + Object.keys(got).length + ' of ' + it.pairs.length + ' matched' + (Object.keys(miss).length ? ' · ' + Object.keys(miss).length + ' missed' : ''); }
      var h = '<div class="kicker">Match it up · ' + esc(it.tid === '~words' ? 'from your test' : short(it.tid)) + '</div><h2>' + esc(it.kind) + '</h2>' +
        '<p class="prompt">Tap one on the left, then its match on the right.</p><div class="prog"><span id="mstat"></span></div>' +
        '<div class="mgrid"><div class="mcol"><div class="lab">' + esc(it.left) + '</div>' + L.map(function (i) { return '<button class="mi" data-l="' + i + '">' + esc(it.pairs[i][0]) + '</button>'; }).join('') + '</div>' +
        '<div class="mcol"><div class="lab">' + esc(it.right) + '</div>' + R.map(function (i) { return '<button class="mi" data-r="' + i + '">' + esc(it.pairs[i][1]) + '</button>'; }).join('') + '</div></div>';
      card.innerHTML = h; stat();
      timer = setInterval(stat, 1000);
      card.onclick = function (e) {
        if (over) return;
        var b = e.target.closest('.mi'); if (!b || b.classList.contains('ok')) return;
        var side = b.hasAttribute('data-l') ? 'l' : 'r', i = +b.getAttribute('data-' + side);
        if (!sel || sel.side === side) { card.querySelectorAll('.mi.sel').forEach(function (x) { x.classList.remove('sel'); }); sel = { side: side, i: i, el: b }; b.classList.add('sel'); return; }
        var li = side === 'l' ? i : sel.i, ri = side === 'r' ? i : sel.i, other = sel.el;
        sel = null; other.classList.remove('sel');
        if (li === ri) { got[li] = 1; b.classList.add('ok'); other.classList.add('ok'); b.disabled = other.disabled = true; }
        else {
          miss[li] = 1; b.classList.add('bad'); other.classList.add('bad');
          setTimeout(function () { b.classList.remove('bad'); other.classList.remove('bad'); }, 650);
        }
        stat();
        if (Object.keys(got).length === it.pairs.length) {
          over = true; stop();
          var mk = Object.keys(miss), m = document.createElement('div'); m.className = 'msg ' + (mk.length ? 'bad' : 'ok');
          m.innerHTML = (mk.length ? 'Done in ' + clock() + ' — mixed up:' : 'All matched in ' + clock() + ', no misses.') +
            (mk.length ? '<ul class="missed" style="margin-top:6px">' + mk.map(function (k) { return '<li>' + esc(it.pairs[k][0]) + ' → <b>' + esc(it.pairs[k][1]) + '</b></li>'; }).join('') + '</ul><span class="why">This round comes back in a few, shuffled.</span>' : '');
          card.appendChild(m); done(!mk.length); nextBtn(card);
        }
      };
    }
  };

  // ---------- Mode ----------
  function setMode(m) {
    mode = m; save();
    tabs.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === m ? 'true' : 'false'); });
    try { history.replaceState(null, '', '#' + m); } catch (e) {}
    fresh();
  }
  tabs.addEventListener('click', function (e) { var b = e.target.closest('[data-mode]'); if (b) { setMode(b.getAttribute('data-mode')); toStage(); } });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (/^(chain|fill|match)$/.test(h) && h !== mode) setMode(h); });

  renderTopics();
  setMode(mode);
})();
</script>
</body>
</html>
