<style>

  .meter { height: 4px; border-radius: 2px; background: var(--color-neutral-800); overflow: hidden; margin-top: 2px; }

<main>
  <header>
    <div class="kicker">NRS 114 · Exam 3 · Study route</div>
    <h1>Your route to the exam.</h1>
  </header>

<script src="data/e3/route.js?v=202610222144"></script>
<script>
// The study route. The tasks come from data/e3/route.js (tools/build_e3_route.js); this page decides, every time it opens:
// - what is already done, from what you did elsewhere in the hub: reading time on the map (e3-read), drug cards opened
//   (e3-drugs-seen), finished Mastery tests and their chapter scores and topic mastery (e3-mastery-v3), the weak-areas
//   page (e3-weak-seen) — plus anything you check off yourself;
// - what to add or change from your results: a fix task after a weak chapter test, shorter retests when you're strong,
//   repairs that name your weakest topics;
// - how to fit the rest into the days left: shorter gaps and Quick reading near the exam, and the least important
//   tasks left out when the days are too short — always saying so.
// Your own settings and checkmarks: localStorage['e3-route'] = { done, undone, hours, day, quick, snap }.
(function () {
  var R = window.E3_ROUTE, KEY = 'e3-route', FOCUS = 'e3-focus', MASTERY = 'Exam 3 Mastery Loop.dc.html';
  if (!R) { document.getElementById('lead').textContent = 'The route didn’t load — reload the page.'; return; }
  var A = R.adapt, P0 = R.pace;
  function read(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function write(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var S;
  function load() {
    S = read(KEY) || {};
    S.done = S.done || {}; S.undone = S.undone || {}; S.day = S.day || {}; S.snap = S.snap || {};
    if (!(S.hours >= 0)) S.hours = R.hours;
    if (S.quick === true) S.quick = 'on'; else if (S.quick !== 'on' && S.quick !== 'off') S.quick = 'auto';
  }
  function save() { write(KEY, { v: 2, done: S.done, undone: S.undone, hours: S.hours, day: S.day, quick: S.quick, snap: S.snap }); }
  // Reading already on the map when a fix task appeared, so only re-reading after the test counts toward it.
  var snapDirty = false;
  function snapFor(G, t) {
    var sn = S.snap[t.id] || (S.snap[t.id] = { s: {} });
    t.topics.forEach(function (id) { if (sn.s[id] == null) { sn.s[id] = secs(G, id); snapDirty = true; } });
    return sn.s;
  }
  load();

  // Dates are local "yyyy-mm-dd" strings. ?today=2026-10-23 shows the route as it would look that day.
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function between(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function dayOf(ms) { return iso(new Date(ms)); }
  var forced = /[?&]today=(\d{4}-\d\d-\d\d)/.exec(location.search), TODAY = forced ? forced[1] : iso(new Date());
  var base = {}, chap = {}, byTopic = {};
  R.tasks.forEach(function (t) { base[t.id] = t; if (t.kind === 'read') byTopic[t.topic] = t; });
  R.chapters.forEach(function (c) { chap[c.ch] = c; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function hm(m) { m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
  function dayName(s) { return parse(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function short(s) { return parse(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function cap(d) { return d === R.exam ? R.examDayMin : Math.round(60 * (S.day[d] != null ? S.day[d] : S.hours)); }
  function lvl(p) { return p >= A.strong ? 'strong' : p >= A.weak ? 'ok' : 'weak'; }

  // ---------- What the hub knows you did ----------
  function signals() {
    var M = read('e3-mastery-v3') || {};
    return {
      read: read('e3-read') || {}, drugs: read('e3-drugs-seen') || {}, weakSeen: +(read('e3-weak-seen') || 0),
      hist: (M.history || []).filter(function (h) { return h && h.at; }).sort(function (a, b) { return a.at - b.at; }),
      topics: (M.mastery || {}).topics || {}, test: M.test || null, practice: M.practice || null
    };
  }
  // Reading on the map: seconds (both modes, or only since a day) and how far a topic is toward counting as read.
  function secs(G, id, since) {
    var r = G.read[id]; if (!r) return 0;
    if (!since) return (r.f || 0) + (r.q || 0);
    var s = 0; Object.keys(r.by || {}).forEach(function (d) { if (d >= since) s += r.by[d][0] + r.by[d][1]; }); return s;
  }
  function readState(G, t) {
    var r = G.read[t.topic] || {}, f = (r.f || 0) / (60 * t.min), q = (r.q || 0) / (60 * t.quick);
    return { p: Math.min(1, Math.max(f, q)), done: f >= A.readFull || q >= A.readQuick, at: r.at || Date.now(), m: ((r.f || 0) + (r.q || 0)) / 60 };
  }
  // Finished tests that count as a chapter's test: enough of its questions, and a big enough share of the test.
  function chapterTests(G) {
    var out = {};
    G.hist.forEach(function (h) {
      Object.keys(h.ch || {}).forEach(function (c) {
        var n = h.ch[c][1]; if (n >= A.testMin && n >= A.testShare * h.n) (out[c] = out[c] || []).push({ at: h.at, day: dayOf(h.at), pct: h.ch[c][0], n: n });
      });
    });
    return out;
  }
  // Practice exams: finished Everything tests of 40 or more questions (and one in progress).
  function practiceExams(G) { return G.hist.filter(function (h) { return h.focus === 'Everything' && h.n >= 40; }); }
  // A group's retest: a later test where the group makes up most of the questions, or a second test of each of its chapters.
  function groupRetest(G, chs, chT) {
    var firsts = chs.map(function (c) { return (chT[c] || [])[0]; });
    if (firsts.some(function (f) { return !f; })) return null;
    var after = firsts.reduce(function (m, f) { return f.day > m ? f.day : m; }, '');
    var hit = null;
    G.hist.forEach(function (h) {
      if (hit || dayOf(h.at) <= after || !h.ch) return;
      var n = 0, s = 0, each = true;
      chs.forEach(function (c) { var x = h.ch[c]; if (!x || x[1] < 3) each = false; else { n += x[1]; s += x[0] * x[1]; } });
      if (each && n >= A.retestShare * h.n) hit = { day: dayOf(h.at), pct: Math.round(s / n), n: n };
    });
    if (hit) return hit;
    var seconds = chs.map(function (c, i) { return (chT[c] || []).filter(function (x) { return x.day > firsts[i].day; })[0]; });
    if (seconds.every(Boolean)) {
      var n2 = 0, s2 = 0; seconds.forEach(function (x) { n2 += x.n; s2 += x.pct * x.n; });
      return { day: seconds.reduce(function (m, x) { return x.day > m ? x.day : m; }, ''), pct: Math.round(s2 / n2), n: n2 };
    }
    return null;
  }
  function examNo(t) { var m = /^(?:exam|repair):(\d)/.exec(t.id); return m ? +m[1] : 0; }

  // Which tasks are done, and how you did them.
  function detect(G, tasks) {
    var D = {}, chT = chapterTests(G), ex = practiceExams(G), T = G.test;
    var running = T && T.focus === 'Everything' && (T.len || 0) >= 40 ? Object.keys(T.checked || {}).length : 0;
    tasks.forEach(function (t) {
      var k = t.kind, hit = null, i, x;
      if (k === 'read') { var rs = readState(G, t); if (rs.done) hit = { day: dayOf(rs.at), how: 'Read on the map: ' + hm(rs.m) }; }
      else if (k === 'drugs') {
        var seen = t.drugs.filter(function (id) { return G.drugs[id]; });
        if (seen.length >= Math.ceil(A.drugs * t.drugs.length)) hit = { day: dayOf(Math.max.apply(null, seen.map(function (id) { return G.drugs[id]; }))), how: seen.length + ' of ' + t.drugs.length + ' cards opened' };
      } else if (k === 'test') {
        x = (chT[t.ch] || [])[0];
        if (x) hit = { day: x.day, pct: x.pct, how: 'Mastery test ' + short(x.day) + ': ' + x.pct + '% on ' + x.n + ' chapter ' + t.ch + ' questions' };
      } else if (k === 'retest') {
        x = groupRetest(G, String(t.ch).split(' '), chT);
        if (x) hit = { day: x.day, pct: x.pct, how: 'Retested ' + short(x.day) + ': ' + x.pct + '% on ' + x.n + ' questions' };
      } else if (k === 'exam') {
        i = examNo(t); x = ex[i - 1];
        if (x) hit = { day: dayOf(x.at), pct: x.pct, how: 'Practice exam ' + short(dayOf(x.at)) + ': ' + x.pct + '% on ' + x.n + ' questions' };
        else if (t.part === 1 && ex.length === i - 1 && running >= 30) hit = { day: TODAY, how: running + ' questions answered so far' };
      } else if (k === 'repair') {
        i = examNo(t); x = ex[i - 1];
        if (x && G.practice && G.practice.at > x.at) hit = { day: dayOf(G.practice.at), how: 'Misses redone ' + short(dayOf(G.practice.at)) };
      } else if (k === 'quick') {
        var tot = 0, need = 0;
        String(t.ch).split(' ').forEach(function (c) { R.tasks.forEach(function (r) { if (r.kind === 'read' && r.ch === c) { tot += secs(G, r.topic, t.from); need += r.quick * 60; } }); });
        if (tot >= 0.5 * need) hit = { day: TODAY > t.from ? TODAY : t.from, how: 'Reviewed on the map: ' + hm(tot / 60) };
      } else if (k === 'last') {
        x = G.hist.filter(function (h) { return dayOf(h.at) >= t.from && h.focus === 'Everything' && h.n >= 15 && h.n < 40; })[0];
        if (x) hit = { day: dayOf(x.at), pct: x.pct, how: 'Mixed test ' + short(dayOf(x.at)) + ': ' + x.pct + '%' };
      } else if (k === 'fix' || k === 'fix2') {
        var base0 = snapFor(G, t), s3 = 0; t.topics.forEach(function (id) { s3 += Math.max(0, secs(G, id) - base0[id]); });
        if (t.topics.length && s3 >= 0.5 * 60 * t.reread) hit = { day: TODAY, how: 'Re-read on the map: ' + hm(s3 / 60) };
        else if (G.practice && G.practice.at > t.testAt) hit = { day: dayOf(G.practice.at), how: 'Misses redone ' + short(dayOf(G.practice.at)) };
      }
      if (hit) D[t.id] = hit;
    });
    return D;
  }
  function isDone(D, id) { return !S.undone[id] && !!(S.done[id] || D[id]); }
  function doneDay(D, id) { return S.done[id] || (D[id] || {}).day; }

  // ---------- Changing the plan from your results ----------
  // Weakest topics (lowest Mastery score) among some chapters; only topics the tests have reached count.
  function weakest(G, chs, k, below) {
    return R.tasks.filter(function (t) { return t.kind === 'read' && chs.indexOf(t.ch) >= 0 && G.topics[t.topic] && G.topics[t.topic].m != null && G.topics[t.topic].m * 100 < below; })
      .sort(function (a, b) { return G.topics[a.topic].m - G.topics[b.topic].m; }).slice(0, k).map(function (t) { return t.topic; });
  }
  function rereadMin(ids) { return ids.reduce(function (n, id) { return n + Math.max(2, Math.round(byTopic[id].min * A.reread)); }, 0); }
  function adapt(G, D0) {
    var tasks = R.tasks.map(function (t) { return Object.assign({}, t, { after: t.after.slice() }); });
    var by = {}; tasks.forEach(function (t) { by[t.id] = t; });
    var chT = chapterTests(G), notes = {};
    function insertAfter(id, t) { var i = tasks.indexOf(by[id]); tasks.splice(i + 1, 0, t); by[t.id] = t; }
    // A weak chapter test → re-read its weakest topics and redo the misses before the group's retest.
    R.chapters.forEach(function (c) {
      var x = (chT[c.ch] || [])[0]; if (!x || x.pct >= A.weak) return;
      var ids = weakest(G, [c.ch], 3, A.strong); if (!ids.length) ids = weakest(G, [c.ch], 2, 101);
      var fix = { id: 'fix:' + c.ch, kind: 'fix', ch: c.ch, topics: ids, since: x.day, testAt: x.at, prio: 2, after: ['test:' + c.ch], href: ids.length ? 'Exam 3 Map.html#' + ids[0] : 'Exam 3 Map.html#weak',
        label: 'Fix chapter ' + c.ch + (ids.length ? ': re-read your ' + (ids.length > 1 ? ids.length + ' weakest topics' : 'weakest topic') + ', then redo the misses' : ': redo the misses'), reread: rereadMin(ids), min: rereadMin(ids) + A.fixRedo };
      notes[fix.id] = 'Your chapter ' + c.ch + ' test was ' + x.pct + '%, below ' + A.weak + '%. These are the topics you missed most.';
      insertAfter('test:' + c.ch, fix);
      R.retests.forEach(function (b) { if (b.chs.indexOf(c.ch) >= 0) by[b.id].after.push([fix.id, 0]); });
    });
    // A strong group → a shorter retest; a weak retest → one more re-read before the practice exams.
    R.retests.forEach(function (b) {
      var t = by[b.id], xs = b.chs.map(function (c) { return (chT[c] || [])[0]; });
      if (!D0[b.id] && xs.every(function (x) { return x && x.pct >= A.strong; })) {
        t.n = 20; t.min = Math.ceil(20 * (P0.question + P0.redo)); t.label = b.name + ' retest, 20 questions on chapters ' + b.chs.join(', ');
        notes[t.id] = 'Shortened from ' + b.n + ' questions: you scored ' + xs.map(function (x) { return x.pct + '%'; }).join(', ') + ' on these chapters.';
      }
      var r = D0[b.id];
      if (r && r.pct < A.weak) {
        var ids = weakest(G, b.chs, 3, A.strong); if (!ids.length) return;
        var f2 = { id: 'fix2:' + b.id.split(':')[1], kind: 'fix2', ch: b.chs.join(' '), topics: ids, since: r.day, testAt: parse(r.day).getTime() + 432e5, prio: 3, after: [b.id], href: 'Exam 3 Map.html#' + ids[0],
          label: 'Re-read after the ' + b.name.toLowerCase() + ' retest: your ' + (ids.length > 1 ? ids.length + ' weakest topics' : 'weakest topic') + ' there', reread: rereadMin(ids), min: rereadMin(ids) };
        notes[f2.id] = 'The retest was ' + r.pct + '%. These topics are still weak.';
        insertAfter(b.id, f2);
      }
    });
    // Repairs name your weakest topics, whatever chapter they are in.
    var allChs = R.chapters.map(function (c) { return c.ch; });
    tasks.forEach(function (t) {
      if (t.kind === 'last') {
        var lw = weakest(G, allChs, 5, A.strong); if (!lw.length) return;
        t.topics = lw; t.min = Math.min(120, rereadMin(lw) + 50);
        t.label = 'Last pass: re-read your ' + lw.length + ' weakest topics, then a 20-question mixed test'; return;
      }
      if (t.kind !== 'repair') return;

      (C.P.out.length ? '<p>Not in the plan for lack of time: ' + C.P.out.map(function (t) { return esc(t.label); }).join('; ') + '.</p>' : '');
  }
  function renderDone(C) {
    var el = document.getElementById('donelist'), list = C.tasks.filter(function (t) { return isDone(C.D, t.id); });
    el.hidden = !list.length;
    if (!list.length) return;
    var by = {}; list.forEach(function (t) { var d = doneDay(C.D, t.id) || TODAY; (by[d] = by[d] || []).push(t); });
    el.innerHTML = '<summary>Done so far: ' + list.length + ' of ' + C.tasks.length + ' tasks</summary><ul>' + Object.keys(by).sort().map(function (d) {
      return '<li><b>' + dayName(d) + '</b>: ' + by[d].map(function (t) { return esc(t.label) + (t.kind === 'read' ? ' (ch ' + t.ch + ')' : '') + (C.D[t.id] && !S.done[t.id] ? ' — ' + esc(C.D[t.id].how) : ''); }).join('; ') + '</li>';
    }).join('') + '</ul><p><button class="btn btn-ghost" type="button" data-reset="1">Clear my checkmarks</button></p>';
  }
  function renderHow() {
    var p = R.pace;
    document.getElementById('how').innerHTML = [
      'It follows what you do. A topic counts as read once the map has had it open for about half its reading time (Full or Quick; time doesn’t count when the screen sits idle). Drug cards count once you’ve opened most of a chapter’s cards. Tests count when you finish them on the Mastery page: a chapter’s test needs ' + A.testMin + ' or more of its questions, practice exams are Everything tests of 40 or more. You can still check anything off yourself, or uncheck it.',
      'It changes the plan from your results. A chapter test under ' + A.weak + '% adds a fix task — re-reading the topics you missed most, then redoing the misses — before that chapter’s retest. If every chapter in a group scored ' + A.strong + '% or more, the group’s retest is cut to 20 questions. A weak retest adds one more re-read. Repairs after the practice exams name your weakest topics.',
      'It changes with the days left. Anything you didn’t get to moves forward. Within ' + A.near + ' days of the exam a retest needs only a 1-day gap; within ' + A.final + ' days, anything still unread is planned in Quick. If the reading no longer fits, the last unread chapters switch to Quick first (with Quick reading on “when needed”); then the least important tasks make room: practice exam 2, the Quick reviews, the drug cards and retests, practice exam 1. Reading and the chapter tests are never left out, and the plan always says what it left out.',
      'Order: the assessment chapters first (53 before 55 and 56; 45 before 46 and 47), the biggest chapters early. Times are estimates: notes at about ' + p.read + ' words a minute, Quick at ' + p.quick + ', about ' + p.question + ' minutes a question with its rationales plus ' + p.redo + ' for redoing misses, ' + p.drug + ' minutes a drug card.',
      'Chapter shares (“20 of the 60 exam questions”) and the topics come from the professor’s study guide: in chapters 53, 45 and 46 only the items it names are on the route; 47, 55 and 56 are whole. The test buttons set the map’s focus to those chapters; the practice exams clear it. Everything here is saved in this browser and goes with your progress file (Home → Save progress file).'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('');
  }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-id]')) {
      var id = t.dataset.id, auto = CUR && CUR.D[id];
      if (t.checked) { delete S.undone[id]; if (!auto) S.done[id] = TODAY; }
      else { delete S.done[id]; if (auto) S.undone[id] = 1; }
      save(); render();
    }
    else if (t.matches('select[data-day]')) { var v = +t.value; if (v === S.hours) delete S.day[t.dataset.day]; else S.day[t.dataset.day] = v; save(); render(); }
    else if (t.id === 'hours') { S.hours = +t.value; save(); render(); }
    else if (t.id === 'quick') { S.quick = t.value; save(); render(); }
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-focus]');
    if (a) { var f = a.dataset.focus; if (f === 'clear') write(FOCUS, null); else write(FOCUS, { ids: f.split(','), name: a.dataset.name }); return; }
    var m = e.target.closest('a[data-mode]');
    if (m) { try { localStorage.setItem('e2-bd-mode', m.dataset.mode); } catch (x) {} return; } // the map opens the topic in that mode
    if (e.target.closest('[data-clear]')) { e.preventDefault(); write(FOCUS, null); render(); }
    var qb = e.target.closest('[data-quick]'); if (qb) { S.quick = qb.dataset.quick; save(); render(); }
    if (e.target.closest('[data-reset]') && window.confirm('Clear the tasks you checked off yourself? What the map and the Mastery page recorded stays.')) { S.done = {}; S.undone = {}; save(); render(); }
  });
  var WATCH = [KEY, FOCUS, 'e3-mastery-v3', 'e3-read', 'e3-drugs-seen', 'e3-weak-seen'];
  window.addEventListener('storage', function (e) { if (WATCH.indexOf(e.key) >= 0) { load(); render(); } });
  // Coming back to this tab (after studying in another) picks up what you did there.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); render(); } });
  render();
})();
</script>
